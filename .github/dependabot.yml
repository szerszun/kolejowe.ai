version: 2
updates:
  # Frontend (root package.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Backend (separate package.json tree, see backend/README.md)
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Keep the regression/CI workflow's actions (checkout, setup-node, the
  # SonarCloud scan action, etc.) current -- these don't get bumped by the
  # npm updates above.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
