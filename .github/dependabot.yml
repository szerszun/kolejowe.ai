version: 2
updates:
  # Frontend (root package.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Backend (separate package.json tree, see backend/README.md)
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Only ever pulled in by @payloadcms/richtext-lexical (via @lexical/headless). Its
      # open advisories have no patched release yet, so every Dependabot security-update
      # run for it failed -- and that failed check landed on the latest main commit, which
      # blocks a Render deploy set to "After CI Checks Pass". Remove this once a fixed
      # version exists (check `npm audit` in backend/), or once Payload ships one.
      - dependency-name: "happy-dom"
      # Same failure mode, seen 2026-10-29: only pulled in by @payloadcms/graphql (via
      # @payloadcms/next), and its ReDoS advisory (PhoneNumber scalar) has no patched
      # release. Not reachable here -- GraphQL is disabled in payload.config.ts -- but the
      # failing run blocked the deploys of #51 and #52. Remove once a fix is published.
      - dependency-name: "graphql-scalars"

  # Keep the regression/CI workflow's actions (checkout, setup-node, the
  # SonarCloud scan action, etc.) current -- these don't get bumped by the
  # npm updates above.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
