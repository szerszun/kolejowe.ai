name: Regression suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    needs: [sonarcloud]
    # Run even if the sonarcloud job failed (e.g. a Quality Gate miss) -- the regression
    # report is still worth generating and emailing, just without a quality summary.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Seed a throwaway local database
        working-directory: backend
        env:
          DATABASE_URL: file:./kolejowe.db
          PAYLOAD_SECRET: ci-ephemeral-secret-not-used-in-production
        run: npm run seed

      - name: Download SonarCloud summary
        # Absent if the sonarcloud job failed before it could upload (e.g. checkout
        # error) -- generate-report.mjs treats a missing file as "unavailable", not fatal.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sonar-summary
          path: sonar-summary

      - name: Run the regression suite
        id: tests
        env:
          CI: "true"
          DATABASE_URL: file:./kolejowe.db
          PAYLOAD_SECRET: ci-ephemeral-secret-not-used-in-production
        # The report step must still run (and the job's pass/fail must reflect the
        # executive verdict, not just "did every command exit 0") even when tests fail --
        # see the explicit exit-code check at the end of this job.
        run: npm test
        continue-on-error: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            test-results/executive-summary.html
            test-results/executive-summary.json
            test-results/playwright-html
          retention-days: 30

      # Only on an actual push to main -- that's what triggers a Render deploy for this
      # project, which is what "after each deploy" means here. PR runs still gate the
      # merge (see the final step) without emailing on every PR update.
      - name: Email report to admin
        if: always() && github.event_name == 'push'
        # Notification delivery failing (e.g. a bad/missing Gmail app password) shouldn't
        # turn the whole job red when the actual regression suite passed -- that's what
        # the explicit verdict check below is for.
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "kolejowe.ai regression report (${{ job.status }}) -- ${{ github.sha }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: kolejowe.ai CI <${{ secrets.GMAIL_USERNAME }}>
          html_body: file://test-results/executive-summary.html
          attachments: test-results/executive-summary.json

      - name: Fail the job if the suite reported NOT READY FOR PRODUCTION
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Regression suite failed -- see the uploaded report artifact for details."
          exit 1

  sonarcloud:
    # GitHub withholds repository secrets from pull_request runs triggered by Dependabot
    # (a deliberate security default -- a malicious/compromised dependency bump shouldn't
    # get CI-level secret access). SONAR_TOKEN is empty there, so the scan would fail
    # "Not authorized" on every single Dependabot PR regardless of actual code quality --
    # confirmed directly on PR #19 (a TypeScript major bump) before adding this. A
    # lockfile-only PR has near-zero code-quality signal for Sonar to add anyway; the
    # `test` job's full regression suite (which does run, with secrets, on these PRs) is
    # what actually verifies a bump didn't break anything.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud wants full history for its new-code/blame analysis, not just the
          # single commit a shallow checkout gives it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npx vitest run --coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fetch SonarCloud quality summary
        # Runs even if the Quality Gate failed above -- the regression report should
        # still be able to show *why* (gate status + the measures behind it).
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p sonar-summary
          curl -sf -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=szerszun_kolejowe.ai" \
            -o sonar-summary/gate.json
          curl -sf -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/measures/component?component=szerszun_kolejowe.ai&metricKeys=bugs,vulnerabilities,code_smells,security_hotspots,coverage" \
            -o sonar-summary/measures.json

      - name: Upload SonarCloud summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-summary
          path: sonar-summary/
          retention-days: 30

  # Only on an actual push to main -- PRs don't trigger a Render deploy, so there's
  # nothing new to verify yet. Deliberately independent of the `test`/`sonarcloud`
  # jobs above: those build and test an ephemeral local checkout, which has already
  # twice given a false sense of safety when the *real* Render deploy broke in a way
  # the local build never could -- a missing production env var, and a backend build
  # that failed on Render's isolated environment while passing locally. A failed
  # Render build also leaves the *previous* commit quietly still serving traffic
  # (no downtime, no obvious error), so a plain "is the site up" check wouldn't catch
  # it either -- this polls for the specific commit SHA to actually be live.
  production-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRONTEND_URL: https://kolejoweai.onrender.com
      BACKEND_URL: https://kolejowe-backend.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          # Only need enough history to diff this commit against its parent, below.
          fetch-depth: 2

      # Render's two services each have their own rootDir (backend/ vs .) and skip
      # rebuilding when a push doesn't touch their own path -- so a frontend-only commit
      # never changes the backend's deployed commit, and vice versa. Waiting for BOTH
      # services to report this exact SHA regardless would time out and fail on nearly
      # every normal commit, since few touch both sides at once (confirmed: this is
      # exactly what happened to commit 2e083aa, a frontend-only change -- not a real
      # deploy failure). Only require a match from the service(s) this push actually
      # touched; the functional checks below still run unconditionally either way.
      - name: Determine which service(s) this push actually changed
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD || echo "")
          BACKEND_FILES=$(echo "$CHANGED" | grep '^backend/' || true)
          NON_BACKEND_FILES=$(echo "$CHANGED" | grep -v '^backend/' || true)
          # Deliberately two separate single-purpose greps rather than one combining -q
          # and -v -- that combination gave inconsistent exit codes on at least one real
          # grep implementation (ugrep) when testing this locally, so it's not trusted
          # here even though GNU grep (what this runner actually uses) gets it right.
          [ -n "$BACKEND_FILES" ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -n "$NON_BACKEND_FILES" ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

      - name: Wait for Render to finish deploying this commit
        env:
          CHECK_FRONTEND: ${{ steps.changed.outputs.frontend }}
          CHECK_BACKEND: ${{ steps.changed.outputs.backend }}
        run: |
          set -e
          echo "This push changed -- frontend: $CHECK_FRONTEND, backend: $CHECK_BACKEND"
          for i in $(seq 1 30); do
            frontend_ok=true
            backend_ok=true
            if [ "$CHECK_FRONTEND" = "true" ]; then
              FRONTEND_COMMIT=$(curl -sf "$FRONTEND_URL/version.json" | jq -r .commit 2>/dev/null || echo "")
              [ "$FRONTEND_COMMIT" = "$GITHUB_SHA" ] || frontend_ok=false
            fi
            if [ "$CHECK_BACKEND" = "true" ]; then
              BACKEND_COMMIT=$(curl -sf "$BACKEND_URL/api/health" | jq -r .commit 2>/dev/null || echo "")
              [ "$BACKEND_COMMIT" = "$GITHUB_SHA" ] || backend_ok=false
            fi
            if [ "$frontend_ok" = "true" ] && [ "$backend_ok" = "true" ]; then
              echo "The service(s) this push changed are live on $GITHUB_SHA."
              exit 0
            fi
            echo "Attempt $i/30: frontend=${FRONTEND_COMMIT:-(unchanged, not checked)} backend=${BACKEND_COMMIT:-(unchanged, not checked)} (want $GITHUB_SHA) -- waiting 20s"
            sleep 20
          done
          echo "::error::Timed out waiting for $GITHUB_SHA to go live (frontend=${FRONTEND_COMMIT:-n/a} backend=${BACKEND_COMMIT:-n/a}) -- a Render build likely failed while the previous commit kept serving traffic."
          exit 1

      - name: Backend serves real line data
        run: |
          set -e
          COUNT=$(curl -sf "$BACKEND_URL/api/lines?limit=1" | jq '.docs | length' 2>/dev/null || echo 0)
          [ "$COUNT" -ge 1 ] || { echo "::error::$BACKEND_URL/api/lines returned no docs."; exit 1; }

      - name: Frontend serves the app shell
        run: |
          set -e
          curl -sf "$FRONTEND_URL/" | grep -q '<div id="root">' || {
            echo "::error::$FRONTEND_URL doesn't contain the app's mount point."
            exit 1
          }

      - name: Write job summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Production smoke test**: commit \`${{ github.sha }}\` is live and healthy on both services." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🔴 **Production smoke test FAILED** for commit \`${{ github.sha }}\` -- see the failing step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Email on failure
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "kolejowe.ai PRODUCTION SMOKE TEST FAILED -- ${{ github.sha }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: kolejowe.ai CI <${{ secrets.GMAIL_USERNAME }}>
          body: |
            Commit ${{ github.sha }} failed the post-deploy production smoke test.

            Run: https://github.com/szerszun/kolejowe.ai/actions/runs/${{ github.run_id }}
            Frontend: https://kolejoweai.onrender.com
            Backend: https://kolejowe-backend.onrender.com

            This usually means a Render build failed and the previous commit is
            still quietly serving traffic -- check the Render dashboard directly.

  # Independent of the jobs above: just needs the frontend build, not the backend or
  # Playwright's browsers, so it stays fast. Vite's own build already warns past 500KB
  # raw on a chunk, but that warning was just scrolling past in a build log with nothing
  # acting on it -- the main JS bundle grew from 1.33MB to 1.36MB over the course of this
  # project's mobile work without anyone noticing. This is what actually stops it from
  # being ignored going forward.
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size budget
        run: node scripts/check-bundle-size.mjs
