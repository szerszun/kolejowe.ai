# SonarCloud project configuration (https://sonarcloud.io).
#
# sonar.projectKey and sonar.organization below are SonarCloud's default
# naming convention when importing a GitHub repo (organization = GitHub
# login lowercased, project key = "<organization>_<repo>") -- verify these
# match exactly what SonarCloud assigned when you created the project
# (Administration > General Settings), and update them here if not.
sonar.projectKey=szerszun_kolejowe.ai
sonar.organization=szerszun

sonar.projectName=kolejowe.ai
sonar.sourceEncoding=UTF-8

# Both the Vite/React frontend and the Payload/Next.js backend, analyzed together.
sonar.sources=src,backend/src
# Only the standalone Playwright suite needs to be listed here -- it's the only test
# code NOT already under sonar.sources. Vitest's *.test.ts files are colocated inside
# src/, so sonar.test.inclusions alone reclassifies them as tests; also listing "src"
# here would make those files ambiguously both a source dir and a test dir, which the
# scanner doesn't reliably resolve.
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Without this, the analyzer has to guess which tsconfig governs which file -- the root
# tsconfig.json is references-only (no compilerOptions of its own), so leaving this to
# auto-detection risks silently falling back to syntax-only analysis (losing every
# type-aware rule) for part of the codebase instead of failing loudly.
sonar.typescript.tsconfigPaths=tsconfig.app.json,backend/tsconfig.json

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/coverage/**,\
  backend/src/payload-types.ts,\
  backend/src/app/(payload)/**

# Unit test coverage only (src/**/*.test.ts, backend/src/**/*.test.ts -- see
# vitest.config.ts). The Playwright E2E/API/build-smoke suite isn't instrumented for
# coverage; that's a different, more involved setup and not what this wires up.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Without this, every React component/page/hook and every Payload/Next.js framework file
# shows as 0% covered (none of them run under Vitest -- they're verified by the Playwright
# E2E/API suite instead, which isn't coverage-instrumented), which drags the project-wide
# number down to a point where it stops meaning anything. Excluding them here makes the
# displayed % reflect only the code that's actually meant to carry unit coverage: pure
# utils/lib logic (src/utils, backend/src/lib/liveMovements.ts, extractJsonBlock in
# backend/src/jobs/openaiClient.ts). One-off maintenance scripts run interactively by a
# human (matchPlkStations, syncLineGeometry, overpass, the verify*/run* agent jobs, seed)
# are excluded too -- they're exercised by running them, not by a regression suite.
# backend/src/lib/plkApi.ts is excluded deliberately, not because it's untestable: it's a
# thin fetch() wrapper around a real external API, better covered by integration-style
# testing than by mocking fetch Response objects line-by-line for little real signal.
sonar.coverage.exclusions=\
  src/components/**,\
  src/pages/**,\
  src/hooks/**,\
  src/i18n/**,\
  src/data/**,\
  src/App.tsx,\
  src/main.tsx,\
  src/lib/payloadClient.ts,\
  backend/src/app/**,\
  backend/src/collections/**,\
  backend/src/globals/**,\
  backend/src/access/**,\
  backend/src/seed/**,\
  backend/src/db/**,\
  backend/src/migrations/**,\
  backend/src/payload.config.ts,\
  backend/src/lib/plkApi.ts,\
  backend/src/jobs/matchPlkStations.ts,\
  backend/src/jobs/syncLineGeometry.ts,\
  backend/src/jobs/overpass.ts,\
  backend/src/jobs/verifyOverview.ts,\
  backend/src/jobs/verifyHistory.ts,\
  backend/src/jobs/runVerifyOverview.ts,\
  backend/src/jobs/runVerifyHistory.ts,\
  backend/src/jobs/run.ts,\
  backend/src/jobs/setupAgentUser.ts,\
  backend/src/jobs/payloadClient.ts,\
  backend/src/jobs/setupTimetableSyncUser.ts,\
  backend/src/jobs/checkTimetableVersion.ts,\
  backend/src/jobs/runSyncTimetables.ts,\
  backend/src/jobs/previewStationTimetable.ts

# The only real duplication in the codebase lives in three declarative data files: PL/EN
# i18n dictionaries that necessarily share identical key structure (src/i18n/translations.ts),
# and two static metadata registries where every entry repeats the same object shape
# (src/data/stationDetails.ts, src/data/lines.ts). Confirmed via SonarCloud's own
# Duplications view: every other file in the project (components, hooks, backend lib/jobs)
# sits at 0.0% -- there is no duplicated *logic* anywhere. Excluding these three keeps the
# metric meaningful: a future real duplication regression in actual code won't be masked
# by this already-reviewed, accepted baseline.
sonar.cpd.exclusions=\
  backend/src/migrations/**,\
  src/i18n/translations.ts,\
  src/data/stationDetails.ts,\
  src/data/lines.ts

# Without this, the sonarcloud CI job always exits 0 once the scan itself completes --
# it never actually checks whether the Quality Gate passed, so a real Blocker/Critical
# issue wouldn't fail the job. This makes the scanner poll for the Quality Gate result
# and fail if it didn't pass.
sonar.qualitygate.wait=true
