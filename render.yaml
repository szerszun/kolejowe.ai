services:
  - name: kolejowe-backend
    type: web
    runtime: node
    plan: free
    rootDir: backend
    # Deploy only after the commit's GitHub checks pass. These services are Blueprint
    # managed, and the dashboard setting alone didn't stick: after a render.yaml change
    # synced on 2026-10-28, both were back on "On Commit" and deployed while CI was still
    # running. Keeping it here makes render.yaml the single source of truth for it.
    autoDeployTrigger: checksPass
    # --include=dev is load-bearing: NODE_ENV=production below (needed at
    # runtime) also applies during the build, which makes plain `npm
    # install` skip devDependencies -- including typescript and @types/react,
    # which `next build`'s typecheck step needs regardless of NODE_ENV.
    buildCommand: npm install --include=dev && npm run build
    # Migrations first (src/db/runMigrations.ts): if one fails, or the database doesn't
    # match the schema in code, the new version never starts and the old one keeps serving.
    startCommand: npm run migrate && npm start
    envVars:
      # Postgres connection string from a Neon project (neon.tech, free
      # tier, no expiry -- unlike Render's own free Postgres, which gets
      # deleted after 30-90 days). Paste it here in Render's dashboard;
      # Neon's strings already include `?sslmode=require`, which the pg
      # driver picks up automatically.
      - key: DATABASE_URL
        sync: false
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Lets the backend allow requests from the frontend's Render-assigned
      # origin automatically, without a manual post-deploy step -- see the
      # CORS_HOST comment in backend/src/payload.config.ts.
      - key: CORS_HOST
        fromService:
          name: kolejoweai
          type: web
          property: host
      # Extra allowed origins (comma-separated full URLs), e.g. once a
      # custom domain is set up. Leave blank if not needed yet.
      - key: CORS_ORIGINS
        value: ''
      # Powers the live arrivals/departures feature once the PLK API key is
      # activated (see backend/src/jobs/matchPlkStations.ts). Not required
      # for the app to run without it.
      - key: PLK_API_KEY
        sync: false
      # Sentry error reporting (backend/src/instrumentation.ts). Optional: without it,
      # nothing is sent. The DSN from Sentry's project settings -> Client Keys.
      - key: SENTRY_DSN
        sync: false
      # Build-time only: uploads source maps to Sentry (next.config.ts). A Sentry org auth
      # token (Settings -> Auth Tokens) -- a secret, unlike the DSN. Optional; without it
      # nothing is uploaded and server stack traces point at compiled code.
      - key: SENTRY_AUTH_TOKEN
        sync: false

  # The backend's move to Frankfurt (eu-central-1), next to the Neon database: in Oregon
  # every query crossed the Atlantic, and a single station took ~1 s. Render can't change
  # an existing service's region, so this is a new service; it runs alongside
  # kolejowe-backend until the frontend and workflows are switched over, then the Oregon
  # one is deleted. Same settings as above -- see the comments there.
  - name: kolejowe-backend-eu
    type: web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    autoDeployTrigger: checksPass
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migrate && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      # Must be the same value as kolejowe-backend's, not a generated one: Payload derives
      # API-key lookups and login tokens from it, so a new secret would break the
      # timetable-sync key and sign everyone out. Copy it from that service's Environment.
      - key: PAYLOAD_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: CORS_HOST
        fromService:
          name: kolejoweai
          type: web
          property: host
      - key: CORS_ORIGINS
        value: ''
      - key: PLK_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false

  - name: kolejoweai
    type: web
    runtime: static
    rootDir: .
    # Deploy only after the commit's GitHub checks pass. These services are Blueprint
    # managed, and the dashboard setting alone didn't stick: after a render.yaml change
    # synced on 2026-10-28, both were back on "On Commit" and deployed while CI was still
    # running. Keeping it here makes render.yaml the single source of truth for it.
    autoDeployTrigger: checksPass
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Without this, Render serves its own "Not Found" for any direct hit on
    # a client-side route (e.g. /station/..., /line/...) or a page refresh
    # on one -- there's no server-side route for those, only React Router
    # handling them after index.html has already loaded.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Render already sends HSTS and nosniff for static sites. The CSP lists every origin the
    # page talks to, as observed on the live site:
    # - scripts: the bundle, and Umami's tracker (src/lib/analytics.ts);
    # - connect: the backend, map tiles (openfreemap), Umami's event endpoint, Sentry's EU ingest;
    # - styles: Google Fonts' CSS (index.css); 'unsafe-inline' only because libraries set
    #   style attributes;
    # - images: any https host, since station and line photos link out to Wikimedia and others;
    # - workers: blob:, which MapLibre uses for its tile workers.
    # The backend host is hard-coded (headers can't use fromService); a custom domain for
    # the backend needs adding here.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://cloud.umami.is;
          connect-src 'self' https://kolejowe-backend.onrender.com https://tiles.openfreemap.org https://gateway.umami.is https://cloud.umami.is https://*.ingest.de.sentry.io;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: blob: https:;
          worker-src 'self' blob:;
          child-src blob:;
          frame-ancestors 'none';
          base-uri 'self';
          object-src 'none';
          form-action 'self'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        # geolocation stays allowed for the site itself: the map's locate-me button.
        value: camera=(), microphone=(), geolocation=(self), payment=()
    envVars:
      # See VITE_PAYLOAD_HOST handling in src/lib/payloadClient.ts -- same
      # auto-wiring idea as CORS_HOST above, just in the other direction.
      - key: VITE_PAYLOAD_HOST
        fromService:
          name: kolejowe-backend
          type: web
          property: host
      # Sentry error reporting in the browser (src/lib/monitoring.ts). Build-time, like
      # every VITE_ variable: a change needs a redeploy. Optional; leave unset to disable.
      - key: VITE_SENTRY_DSN
        sync: false
      # Visitor analytics (src/lib/analytics.ts): the Website ID from Umami Cloud's
      # Settings -> Websites. Not a secret -- it ends up in the page. Build-time like every
      # VITE_ variable, so a change needs a redeploy. Optional; leave unset to disable.
      - key: VITE_UMAMI_WEBSITE_ID
        sync: false
      # Build-time only: uploads source maps to Sentry and deletes them from dist/ (see
      # vite.config.ts). Same org auth token as the backend's. Optional; without it browser
      # stack traces stay minified.
      - key: SENTRY_AUTH_TOKEN
        sync: false
