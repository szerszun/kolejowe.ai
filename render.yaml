services:
  - name: kolejowe-backend
    type: web
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Postgres connection string from a Neon project (neon.tech, free
      # tier, no expiry -- unlike Render's own free Postgres, which gets
      # deleted after 30-90 days). Paste it here in Render's dashboard;
      # Neon's strings already include `?sslmode=require`, which the pg
      # driver picks up automatically.
      - key: DATABASE_URL
        sync: false
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Lets the backend allow requests from the frontend's Render-assigned
      # origin automatically, without a manual post-deploy step -- see the
      # CORS_HOST comment in backend/src/payload.config.ts.
      - key: CORS_HOST
        fromService:
          name: kolejowe-frontend
          type: web
          property: host
      # Extra allowed origins (comma-separated full URLs), e.g. once a
      # custom domain is set up. Leave blank if not needed yet.
      - key: CORS_ORIGINS
        value: ''
      # Powers the live arrivals/departures feature once the PLK API key is
      # activated (see backend/src/jobs/matchPlkStations.ts). Not required
      # for the app to run without it.
      - key: PLK_API_KEY
        sync: false

  - name: kolejowe-frontend
    type: web
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # See VITE_PAYLOAD_HOST handling in src/lib/payloadClient.ts -- same
      # auto-wiring idea as CORS_HOST above, just in the other direction.
      - key: VITE_PAYLOAD_HOST
        fromService:
          name: kolejowe-backend
          type: web
          property: host
