services:
  - name: kolejowe-backend
    type: web
    runtime: node
    plan: free
    rootDir: backend
    # Deploy only after the commit's GitHub checks pass. These services are Blueprint
    # managed, and the dashboard setting alone didn't stick: after a render.yaml change
    # synced on 2026-10-28, both were back on "On Commit" and deployed while CI was still
    # running. Keeping it here makes render.yaml the single source of truth for it.
    autoDeployTrigger: checksPass
    # --include=dev is load-bearing: NODE_ENV=production below (needed at
    # runtime) also applies during the build, which makes plain `npm
    # install` skip devDependencies -- including typescript and @types/react,
    # which `next build`'s typecheck step needs regardless of NODE_ENV.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      # Postgres connection string from a Neon project (neon.tech, free
      # tier, no expiry -- unlike Render's own free Postgres, which gets
      # deleted after 30-90 days). Paste it here in Render's dashboard;
      # Neon's strings already include `?sslmode=require`, which the pg
      # driver picks up automatically.
      - key: DATABASE_URL
        sync: false
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Lets the backend allow requests from the frontend's Render-assigned
      # origin automatically, without a manual post-deploy step -- see the
      # CORS_HOST comment in backend/src/payload.config.ts.
      - key: CORS_HOST
        fromService:
          name: kolejoweai
          type: web
          property: host
      # Extra allowed origins (comma-separated full URLs), e.g. once a
      # custom domain is set up. Leave blank if not needed yet.
      - key: CORS_ORIGINS
        value: ''
      # Powers the live arrivals/departures feature once the PLK API key is
      # activated (see backend/src/jobs/matchPlkStations.ts). Not required
      # for the app to run without it.
      - key: PLK_API_KEY
        sync: false
      # Sentry error reporting (backend/src/instrumentation.ts). Optional: without it,
      # nothing is sent. The DSN from Sentry's project settings -> Client Keys.
      - key: SENTRY_DSN
        sync: false

  - name: kolejoweai
    type: web
    runtime: static
    rootDir: .
    # Deploy only after the commit's GitHub checks pass. These services are Blueprint
    # managed, and the dashboard setting alone didn't stick: after a render.yaml change
    # synced on 2026-10-28, both were back on "On Commit" and deployed while CI was still
    # running. Keeping it here makes render.yaml the single source of truth for it.
    autoDeployTrigger: checksPass
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Without this, Render serves its own "Not Found" for any direct hit on
    # a client-side route (e.g. /station/..., /line/...) or a page refresh
    # on one -- there's no server-side route for those, only React Router
    # handling them after index.html has already loaded.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # See VITE_PAYLOAD_HOST handling in src/lib/payloadClient.ts -- same
      # auto-wiring idea as CORS_HOST above, just in the other direction.
      - key: VITE_PAYLOAD_HOST
        fromService:
          name: kolejowe-backend
          type: web
          property: host
      # Sentry error reporting in the browser (src/lib/monitoring.ts). Build-time, like
      # every VITE_ variable: a change needs a redeploy. Optional; leave unset to disable.
      - key: VITE_SENTRY_DSN
        sync: false
